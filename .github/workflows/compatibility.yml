name: Groundworkers compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [groundworkers-compatibility]

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ github.event.client_payload.python_versions || fromJSON('["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions and install the wheel
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.groundworkers_version }}
        run: |
          python -m pip install build ruff packaging
          python -m build
          if [ -n "$REQUESTED_VERSION" ]; then
            version=$(python -c 'import os; from packaging.version import Version; print(Version(os.environ["REQUESTED_VERSION"]))')
            python -m pip install dist/*.whl "groundworkers==$version"
          else
            python -m pip install dist/*.whl
          fi
          python -m pip check
      - name: Check code and installed plugin
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
          python -m unittest discover -s tests -v
      - name: Record compatibility result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import os
          import platform

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for package in ("groundworkers-omophub", "groundworkers"):
                  try:
                      installed = metadata.version(package)
                  except metadata.PackageNotFoundError:
                      installed = "unavailable"
                  print(f"- {package} `{installed}`", file=summary)
              print(f"- Python `{platform.python_version()}`", file=summary)
              print(f"- Commit `{os.environ['GITHUB_SHA']}`", file=summary)
              print(f"- Result {os.environ['RESULT']}", file=summary)
              print(f"- {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}", file=summary)
          PY
